version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dsa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-dsa_focus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dsa_focus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dsa_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dsa_server
    restart: unless-stopped
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-dsa_focus}
      JWT_SECRET: ${JWT_SECRET:-super-secret-dev-key-change-in-prod}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/auth/google/callback
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsa_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: builder
    container_name: dsa_client
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://server:3000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - dsa_network

volumes:
  postgres_data:
    name: dsa_postgres_data

networks:
  dsa_network:
    name: dsa_network
    driver: bridge
