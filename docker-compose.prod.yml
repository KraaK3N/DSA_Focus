version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dsa_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dsa_prod_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dsa_server_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: https://${DOMAIN_NAME:-localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: https://${DOMAIN_NAME:-localhost}/api/auth/google/callback
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsa_prod_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    container_name: dsa_client_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - dsa_prod_network

volumes:
  postgres_prod_data:
    name: dsa_postgres_prod_data

networks:
  dsa_prod_network:
    name: dsa_prod_network
    driver: bridge
